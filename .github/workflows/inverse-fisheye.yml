name: Inverse fisheye numerical checks
on:
  pull_request:
    paths:
      - 'nrpy/**'
      - '.github/scripts/check_inverse_fisheye.py'
      - '.github/workflows/inverse-fisheye.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0 mpmath==1.3.0 clang-format==22.1.8 appdirs==1.4.4 typing-extensions==4.12.2
      - run: python -m pip install --no-deps nrpypn==2.0.1 nrpylatex==1.4.0
      - run: python -m nrpy.equations.generalrfm.inverse_fisheye
      - run: PYTHONPATH=. python .github/scripts/check_inverse_fisheye.py
      - run: PYTHONPATH=. python .github/scripts/check_inverse_fisheye.py --wave-project
