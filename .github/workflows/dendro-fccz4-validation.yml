name: Dendro fCCZ4 validation

# No step uses GITHUB_TOKEN; only actions/checkout needs the repository
# contents, so the token is capped at read-only rather than inheriting the
# repository default.
permissions:
  contents: read

# The NRPy-generated FCCZ4_GR module is a build-and-run product: generation
# succeeding proves nothing about whether the emitted C++ compiles or whether
# the Minkowski lifecycle gates hold.  The static-analysis job already executes
# every owning module, so the symbolic and emitted-source contracts run there
# as owner doctests; this job covers only what needs a compiler and MPI.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dendro-fccz4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get -y install ninja-build openmpi-bin libopenmpi-dev

      - name: Generate the FCCZ4_GR module
        run: PYTHONPATH=. python -m nrpy.examples.dendro_fccz4 --project-dir project/dendro_fccz4 --fd-order 4 --no-ko

      - name: Build the generated project
        # The generated module compiles with -Wall -Wextra -Werror, and an
        # optimized build type is what exposes warnings the default
        # unoptimized configuration cannot reach.
        run: |
          cmake -S project/dendro_fccz4/Dendro-GR/FCCZ4_GR -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build

      - name: Run the generated self-tests
        # --no-tests=error: bare ctest exits 0 when a project registers no
        # tests at all, so without this the step could report green while
        # validating nothing.
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Run the Minkowski lifecycle gates under MPI
        # fccz4Solver exits non-zero when any gate fails, so no output parsing
        # is needed here.
        run: mpirun -n 2 --oversubscribe ./build/fccz4Solver
