          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrnqc_bob -calibration_no_spin && (cd project/seobnrv5_nrnqc_bob_calibration_no_spin && make && make clean) &&
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_bob -calibration_spin && (cd project/seobnrv5_bob_calibration_spin && make && make clean) &&
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrpy -calibration_spin && (cd project/seobnrv5_nrpy_calibration_spin && make && make clean) &&
