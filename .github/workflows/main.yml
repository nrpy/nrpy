name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Run on the 1st and 15th of each month, at 4:47AM UTC, to check for breakages due to e.g., sympy-dev.
  schedule:
    - cron: '47 4 1,15 * *'

jobs:
  static-analysis:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ 'ubuntu-22.04', 'ubuntu-24.04' ]
        python-version: [ '3.7.13', '3.8.12', '3.9.19', '3.x' ]
        exclude:
          - os: 'ubuntu-24.04'
            python-version: '3.7.13'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U -r requirements.txt matplotlib
          if [[ "${{ matrix.python-version }}" != "3.7.13"  && "${{ matrix.python-version }}" != "3.8.12" && "${{ matrix.python-version }}" != "3.9.19" ]]; then
            pip install -U -r requirements-dev.txt
            # Pin before the regression reported in https://github.com/sympy/sympy/issues/30395.
            pip install git+https://github.com/sympy/sympy.git@024191d3c79c74b20457d7e5534ae010ac171aab
          else
            # Install packages from requirements-dev.txt without fixed versions; i.e., install the latest version compatible with this Python version.
            sed 's/==.*//' requirements-dev.txt | xargs pip install -U
            pip install sympy
          fi
          if [[ "${{ matrix.python-version }}" == "3.8.12" ]]; then
            pip install pylint==3.2.0  # pylint 3.2.4+ is broken in 3.8.12.
          fi
          # FIXME: until NRPyLaTeX is updated in pypi.
          pip install -U nrpylatex
          pip install -U ipython setuptools
          sudo apt-get update && sudo apt-get -y install libgsl-dev

      - name: Display sympy and clang-format versions
        run: |
          echo "Running CI tests with SymPy version = $(isympy --version)"
          echo "Running CI tests with clang-format version = $(clang-format --version)"

      - name: Run static analysis on each file.
        run: |
          #!/bin/bash

          # Exit immediately if a command exits with a non-zero status, except in specific cases
          set -e

          # Function to handle each test step
          run_test_step() {
            local step_name="$1"
            local command="$2"
            local failure_message="$3"

            echo "-={ Step $step_counter: $step_name }=-"
            eval "$command"
            if [ $? -ne 0 ]; then
              failed_tests+=("$failure_message in $python_file")
            fi
            ((step_counter++))
          }

          # Clear cache
          echo "Clearing cache..."
          rm -rf ~/.cache/nrpy
          echo "Cache cleared."

          # Get Python version
          python_version=$(python --version 2>&1)
          echo "Python version: $python_version"
          python_minor=$(python -c 'import sys; print(sys.version_info.minor)')
          echo "Python minor version: $python_minor"
          run_black=false
          if (( python_minor >= 10 )); then run_black=true; fi

          # Initialize array to store failed tests
          failed_tests=()

          # Find all relevant Python files recursively and store them in a temporary file
          echo "Locating Python files..."
          find . -type f -name '*.py' \
            ! -name '__init__.py' \
            ! -path './project/*' \
            ! -path './build/*' \
            ! -path '*/tests/*' \
            ! -path '*manga*' \
            ! -path './nrpy/examples/visualization_scripts/*' > python_files.txt

          # Count total number of Python files
          total_files=$(wc -l < python_files.txt)
          echo "Found $total_files Python file(s) to analyze."

          # Initialize file counter
          file_counter=1

          # Loop through each Python file
          while IFS= read -r python_file; do
            echo ""

            # Initialize step counter for each file
            step_counter=1

            echo "-={ $python_file : file $file_counter of $total_files for static analysis }=-"

            # Run Doctests if not in nrpy/examples/ and not in root directory
            if [[ ! $python_file =~ nrpy/examples/.* && ! $python_file =~ ^\./[^/]+\.py$ ]]; then
              run_test_step "Doctests" "PYTHONPATH=.:$PYTHONPATH python \"$python_file\"" "doctests"
            fi

            # Run black only on Python >= 3.10.
            if [[ "$run_black" == "true" ]]; then
              # Step: black
              run_test_step "black" "black --check \"$python_file\"" "black"
            fi

            # Skip isort & mypy for Python < 3.9
            if [[ "$python_version" != *"3.7.13"* && "$python_version" != *"3.8.12"* ]]; then
              # Step: isort
              run_test_step "isort" "isort --check-only \"$python_file\"" "isort"

              # Step: mypy
              run_test_step "mypy" "PYTHONPATH=.:$PYTHONPATH mypy --strict --pretty --allow-untyped-calls \"$python_file\"" "mypy"
            fi

            # Step: pylint
            echo "-={ Step $step_counter: pylint }=-"
            if [[ "$python_version" == *"3.7.13"* || "$python_version" == *"3.8.12"* ]]; then
              pylint_rcfile=".pylintrc_python36"
            else
              pylint_rcfile=".pylintrc"
            fi

            # Run pylint and capture the output, prevent 'set -e' from exiting on failure
            pylint_output=$(PYTHONPATH=.:$PYTHONPATH pylint --rcfile="$pylint_rcfile" "$python_file" 2>&1 || true)

            # Extract the Pylint score by searching for "rated at" and extracting the number before "/10"
            pylint_score=$(echo "$pylint_output" | grep "rated at" | grep -Eo '[0-9]+\.[0-9]+' | head -1 || echo "0")

            echo "Pylint score is $pylint_score"

            if (( $(echo "$pylint_score < 9.5" | bc -l) )); then
              echo "$pylint_output"
              echo "Pylint score is below 9.5, failing..."
              failed_tests+=("pylint in $python_file")
            fi
            ((step_counter++))

            # Step: pydocstyle
            run_test_step "pydocstyle" "pydocstyle \"$python_file\"" "pydocstyle"

            # Step: darglint
            run_test_step "darglint" "darglint -v 2 \"$python_file\"" "darglint"

            # Increment file counter
            ((file_counter++))

          done < python_files.txt

          # Remove temporary file
          rm python_files.txt

          # Exit with failure if any tests failed
          if [ ${#failed_tests[@]} -ne 0 ]; then
            echo ""
            echo "The following tests failed: ${failed_tests[*]}"
            exit 1
          fi

          echo ""
          echo "All static analysis tests passed successfully."

  einsteintoolkit-validation:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.2

      - name: Download Apptainer image
        run: wget -q https://github.com/nrpy/einsteintoolkit_ci_images/releases/download/v1.1.0/custom_ubuntu.sif

      - name: Disable AppArmor restriction on unprivileged user namespaces, needed for 24.04 compatibility.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Apptainer sandbox
        run: apptainer build --sandbox custom_ubuntu_sandbox custom_ubuntu.sif

      - name: Run Apptainer container
        run: |
          apptainer exec --writable custom_ubuntu_sandbox bash -c "
          set -e
          rm -f /opt/FAILED.txt
          source /opt/jup312/bin/activate
          export PYTHONPATH=.:\$PYTHONPATH
          python3 --version && isympy --version
          cd /home/runner/work/nrpy/nrpy
          git log | head
          python3 -u nrpy/examples/carpet_wavetoy_thorns.py
          python3 -u nrpy/examples/carpet_baikal_thorns.py
          git clone -q https://bitbucket.org/zach_etienne/wvuthorns.git /tmp/wvuthorns
          git -C /tmp/wvuthorns checkout -q --detach ae1086c46fd06cedccad22199cbdaae070f3b2a3
          cd /opt/ET_2024_06_beta/arrangements/WVUThorns/
          rm Baikal*
          ln -s /home/runner/work/nrpy/nrpy/project/et_baikal/Baikal* .
          ln -s /home/runner/work/nrpy/nrpy/project/et_wavetoy/* .
          ln -s /home/runner/work/nrpy/nrpy/nrpy/examples/et_WaveToyfiles/test WaveToyNRPy/
          cp -r /tmp/wvuthorns/Baikal/test Baikal/
          cp -r /tmp/wvuthorns/BaikalVacuum/test BaikalVacuum/
          cd /opt/ET_2024_06_beta/
          ./make_config-runmefirst-gcc
          make
          export CCTK_TESTSUITE_RUN_TESTS='Baikal BaikalVacuum WaveToyNRPy'
          export PROMPT=no
          make etilgrmhdgcc-testsuite
          awk '/Number failed/ { if (\$NF != 0) system(\"touch /opt/FAILED.txt\") }' /opt/ET_2024_06_beta/TEST/etilgrmhdgcc/summary.log
          if [ -f /opt/FAILED.txt ]; then
            echo AT LEAST ONE ET TEST FAILED
            exit 1
          else
            echo ET TESTS SUCCEEDED
          fi
          "

  dendro-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified Apptainer
        run: |
          curl --fail --location \
            --output "$RUNNER_TEMP/apptainer.deb" \
            https://github.com/apptainer/apptainer/releases/download/v1.3.2/apptainer_1.3.2_amd64.deb
          echo "f9da880012b39809c2198240e1d46e2615dbf9b041d5d7f9e78b791af9ac0fb5  $RUNNER_TEMP/apptainer.deb" \
            | sha256sum --check --strict
          sudo apt-get install -y "$RUNNER_TEMP/apptainer.deb"

      - name: Download verified Dendro image
        run: |
          curl --fail --location \
            --output "$RUNNER_TEMP/dendro-ubuntu24.04.5.sif" \
            https://github.com/nrpy/dendro_ci_images/releases/download/1.0.0/dendro-ubuntu24.04.5.sif
          echo "75c38524c4685d3cf45946b8897505ba0d2a6a8b5c4d41fecc22092bbbf420c8  $RUNNER_TEMP/dendro-ubuntu24.04.5.sif" \
            | sha256sum --check --strict

      - name: Disable AppArmor restriction on unprivileged user namespaces, needed for 24.04 compatibility.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check generated Dendro modules and real-host integration
        run: |
          mkdir -p "$RUNNER_TEMP/dendro-validation"
          apptainer exec --cleanenv \
            --bind "$GITHUB_WORKSPACE:/nrpy:ro" \
            --bind "$RUNNER_TEMP/dendro-validation:/ci-work" \
            "$RUNNER_TEMP/dendro-ubuntu24.04.5.sif" bash -s <<'BASH'
          set -euo pipefail
          export OMP_NUM_THREADS=1
          export PYTHONPATH=/nrpy

          for formulation in bssn fccz4; do
            for fd_order in 4 6 8; do
              for ko_mode in on off; do
                profile="${formulation}-fd${fd_order}-ko-${ko_mode}"
                project="/ci-work/${profile}"
                build="/ci-work/build-${profile}"
                if [ "$ko_mode" = on ]; then
                  ko_option=--ko
                else
                  ko_option=--no-ko
                fi
                python -u -m "nrpy.examples.dendro_${formulation}" \
                  --project-dir "$project" --fd-order "$fd_order" "$ko_option"
                cmake -S "$project/Dendro-GR/nrpy_${formulation}" -B "$build" \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DNRPY_DENDRO_BUILD_DRIVERS=ON \
                  -DNRPY_DENDRO_BUILD_TESTS=ON
                cmake --build "$build" --parallel
                ctest --test-dir "$build" --no-tests=error --output-on-failure
              done
            done
          done

          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          for formulation in bssn fccz4; do
            for fd_order in 4 6 8; do
              for ko_mode in on off; do
                profile="${formulation}-fd${fd_order}-ko-${ko_mode}"
                project="/ci-work/${profile}"
                sanitizer_build="/ci-work/sanitizer-${profile}"
                cmake -S "$project/Dendro-GR/nrpy_${formulation}" \
                  -B "$sanitizer_build" \
                  -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
                  -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
                  -DNRPY_DENDRO_BUILD_DRIVERS=OFF \
                  -DNRPY_DENDRO_BUILD_TESTS=ON
                cmake --build "$sanitizer_build" --parallel --target \
                  "${formulation}_self_tests"
                ctest --test-dir "$sanitizer_build" --no-tests=error \
                  --output-on-failure \
                  -R "^${formulation}_(offsets|address_values|gr_nonflat_reference)$"
              done
            done
          done

          cp -a "$DENDRO_GR_SOURCE" /ci-work/host
          cp -a "$DENDROLIB_SOURCE" /ci-work/dendrolib
          cat >> /ci-work/host/CMakeLists.txt <<'CMAKE_EOF'
          add_subdirectory("${NRPY_BSSN_GENERATED}/Dendro-GR/nrpy_bssn" nrpy_bssn)
          add_subdirectory("${NRPY_FCCZ4_GENERATED}/Dendro-GR/nrpy_fccz4" nrpy_fccz4)
          add_executable(nrpy_bssn_runtime_test
            "/nrpy/nrpy/infrastructures/Dendro/tests_infra/runtime_integration_test.cpp")
          target_link_libraries(nrpy_bssn_runtime_test PRIVATE nrpy_bssn_dendro MPI::MPI_CXX)
          target_compile_definitions(nrpy_bssn_runtime_test PRIVATE
            RUNTIME_HEADER="bssnCtx.h" RUNTIME_NAMESPACE=nrpy::bssn)
          add_executable(nrpy_fccz4_runtime_test
            "/nrpy/nrpy/infrastructures/Dendro/tests_infra/runtime_integration_test.cpp")
          target_link_libraries(nrpy_fccz4_runtime_test PRIVATE nrpy_fccz4_dendro MPI::MPI_CXX)
          target_compile_definitions(nrpy_fccz4_runtime_test PRIVATE
            RUNTIME_HEADER="fccz4Ctx.h" RUNTIME_NAMESPACE=nrpy::fccz4)
          CMAKE_EOF

          expect_failure() {
            ranks=$1
            executable=$2
            formulation=$3
            fault=$4
            diagnostic=$5
            log="/ci-work/${formulation}-${fault}.log"
            set +e
            timeout --signal=KILL 300 mpiexec --oversubscribe -n "$ranks" \
              "$executable" "$fault" >"$log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ] || [ "$status" -eq 124 ] || \
               [ "$status" -eq 137 ] || ! grep -Fq "$diagnostic" "$log"; then
              cat "$log"
              echo "${formulation} ${fault}: expected diagnostic was not detected"
              return 1
            fi
          }

          expect_command_failure() {
            diagnostic=$1
            log=$2
            shift 2
            set +e
            timeout --signal=KILL 300 "$@" >"$log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ] || [ "$status" -eq 124 ] || \
               [ "$status" -eq 137 ] || ! grep -Fq "$diagnostic" "$log"; then
              cat "$log"
              echo "expected diagnostic was not detected"
              return 1
            fi
          }

          for real_profile in 4-on 6-on 8-on 6-off; do
            fd_order=${real_profile%-*}
            ko_mode=${real_profile#*-}
            cmake -S /ci-work/host -B /ci-work/real-build \
              -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DCPU_ARCH=native \
              -DNRPY_DENDRO_BUILD_DRIVERS=ON \
              -DNRPY_DENDRO_BUILD_TESTS=OFF \
              -DNRPY_BSSN_GENERATED="/ci-work/bssn-fd${fd_order}-ko-${ko_mode}" \
              -DNRPY_FCCZ4_GENERATED="/ci-work/fccz4-fd${fd_order}-ko-${ko_mode}" \
              -DDENDRO_dendrolib_DIR=/ci-work/dendrolib \
              -DDENDRO_dendrolib_GIT_TAG=246043709e806021fcfc011fe657b8bf964cae4c \
              -DFETCHCONTENT_SOURCE_DIR_TOML11="$TOML11_SOURCE" \
              -DFETCHCONTENT_SOURCE_DIR_SPDLOG="$SPDLOG_SOURCE"
            GIT_DIR=/ci-work/host/.git GIT_WORK_TREE=/ci-work/host \
              cmake --build /ci-work/real-build --parallel --target \
                nrpy_bssn_dendro_qualify nrpy_fccz4_dendro_qualify \
                nrpy_bssn_runtime_test nrpy_fccz4_runtime_test

            for formulation in bssn fccz4; do
              project="/ci-work/${formulation}-fd${fd_order}-ko-${ko_mode}"
              runtime="/ci-work/real-build/nrpy_${formulation}_runtime_test"
              qualifier="/ci-work/real-build/nrpy_${formulation}/nrpy_${formulation}_dendro_qualify"
              parfile="$project/Dendro-GR/nrpy_${formulation}/pars/${formulation}_minkowski.par"
              timeout --signal=KILL 300 mpiexec --oversubscribe -n 1 "$runtime"
              timeout --signal=KILL 300 mpiexec --oversubscribe -n 2 "$runtime"
              timeout --signal=KILL 300 mpiexec --oversubscribe -n 2 \
                "$qualifier" --steps 1 --dt 0.001 -t "$parfile"

              if [ "$fd_order-$ko_mode" = 6-off ]; then
                expect_failure 1 "$runtime" "$formulation" element_order \
                  "Dendro element order does not match generated FD_ORDER"
                expect_failure 2 "$runtime" "$formulation" offset \
                  "unfilled block halo or interior"
                expect_failure 2 "$runtime" "$formulation" halo \
                  "transport qualification failed"
                expect_failure 2 "$runtime" "$formulation" nonfinite \
                  "nonfinite evolved state"
                expect_failure 1 "$runtime" "$formulation" blockwise_null_ids \
                  "blockwise RHS received null block identifiers"
                expect_failure 1 "$runtime" "$formulation" blockwise_bad_id \
                  "blockwise RHS block identifier is out of range"
                expect_failure 1 "$runtime" "$formulation" blockwise_bad_dof \
                  "blockwise RHS field count does not match generated state"
                expect_failure 1 "$runtime" "$formulation" block_null \
                  "flat block RHS received a null field array"
                expect_failure 1 "$runtime" "$formulation" block_bad_dof \
                  "flat block RHS field count does not match generated state"
                expect_failure 1 "$runtime" "$formulation" block_bad_id \
                  "flat block RHS block identifier is out of range"
                expect_failure 1 "$runtime" "$formulation" projection_null \
                  "block projection received a null field array"
                expect_failure 1 "$runtime" "$formulation" projection_bad_dof \
                  "block projection field count does not match generated state"
                expect_failure 1 "$runtime" "$formulation" projection_bad_id \
                  "block projection block identifier is out of range"

                bad_parfile="/ci-work/${formulation}-profile-mismatch.par"
                cp "$parfile" "$bad_parfile"
                sed -i 's/^fd_order = 6$/fd_order = 4/' "$bad_parfile"
                expect_command_failure \
                  "profile fd_order mismatch: expected 6, observed 4" \
                  "/ci-work/${formulation}-profile-mismatch.log" \
                  mpiexec --oversubscribe -n 2 "$qualifier" --steps 1 \
                  --dt 0.001 -t "$bad_parfile"
              fi
            done
          done
          BASH

  charmpp-validation:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.2

      - name: Download Apptainer image
        run: wget -q https://github.com/nrpy/charmpp_barebones_ci_images/releases/download/v1.0.0/custom_ubuntu_charmpp.sif

      - name: Disable AppArmor restriction on unprivileged user namespaces, needed for 24.04 compatibility.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Apptainer sandbox
        run: apptainer build --sandbox custom_ubuntu_charmpp_sandbox custom_ubuntu_charmpp.sif

      - name: Run Apptainer container
        run: |
          apptainer exec --writable custom_ubuntu_charmpp_sandbox bash -c "
          set -e
          source /opt/jup312/bin/activate
          export PYTHONPATH=.:\$PYTHONPATH
          export PATH=/opt/charm-8.0.0/bin:\$PATH
          export LD_LIBRARY_PATH=/opt/charm-8.0.0/lib:\$LD_LIBRARY_PATH
          export C_INCLUDE_PATH=/opt/charm-8.0.0/include:\$C_INCLUDE_PATH
          export CPLUS_INCLUDE_PATH=/opt/charm-8.0.0/include:\$CPLUS_INCLUDE_PATH
          python3 --version && isympy --version
          cd /home/runner/work/nrpy/nrpy
          git log | head

          python3 -u nrpy/examples/superB_nrpyelliptic_conformally_flat.py
          cd project/superB_nrpyelliptic_conformally_flat/
          make -j2
          cd /home/runner/work/nrpy/nrpy
          python3 -u nrpy/examples/superB_blackhole_spectroscopy.py
          cd project/superB_blackhole_spectroscopy/
          make -j2
          cd /home/runner/work/nrpy/nrpy
          python3 -u nrpy/examples/superB_two_blackholes_collide.py
          cd project/superB_two_blackholes_collide/
          make -j2
          ./charmrun +p2 ./superB_two_blackholes_collide
          "

  codegen-ubuntu:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ 'ubuntu-22.04', 'ubuntu-24.04' ]
        python-version: [ '3.9.19', '3.x' ]
        exclude:
          - os: 'ubuntu-24.04'
            python-version: '3.9.19'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [[ "${{ matrix.python-version }}" != "3.7.13" ]]; then pip install -U mypy==1.8.0 black==24.1.1; fi
               pip install -U pylint clang-format ipython setuptools
               sudo apt-get update && sudo apt-get -y install libgsl-dev

      #    - name: Setup tmate session
      #      uses: mxschmitt/action-tmate@v3
      #      timeout-minutes: 15

      - name: Check that pip installed nrpy creates valid, compilable C example projects
        run: |
          pwd &&
          pip install . &&
          mkdir tmp &&
          cd tmp &&
          python -m nrpy.examples.nrpyelliptic_conformally_flat && (cd project/nrpyelliptic_conformally_flat && make && make clean) &&
          python -m nrpy.examples.wave_equation_cartesian   && (cd project/wave_equation_cartesian && make && make clean) &&
          python -m nrpy.examples.wave_equation_curvilinear && (cd project/wave_equation_curvilinear && make && make clean) &&
          python -m nrpy.examples.two_blackholes_collide    && (cd project/two_blackholes_collide && make && make clean) &&
          python -m nrpy.examples.blackhole_spectroscopy    && (cd project/blackhole_spectroscopy && make && make clean) &&
          python -m nrpy.examples.spinning_blackhole        && (cd project/spinning_blackhole && make && make clean) &&
          python -m nrpy.examples.nrpypn_quasicircular_momenta && (cd project/nrpypn_quasicircular_momenta && make && make clean) &&
          python -m nrpy.examples.wave_equation_multicoordinates && (cd project/wave_equation_multicoordinates && make && make clean) &&
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_bob && (cd project/seobnrv5_bob && make && make clean) &&
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrpy && (cd project/seobnrv5_nrpy && make && make clean) &&
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrnqc_bob && (cd project/seobnrv5_nrnqc_bob && make && make clean) &&
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_bob -calibration_no_spin && (cd project/seobnrv5_bob_calibration_no_spin && make && make clean) &&
