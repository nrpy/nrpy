  sebob-consistency-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ 'ubuntu-22.04', 'ubuntu-24.04' ]
        python-version: [ '3.7.13', '3.x' ]
        exclude:
          - os: 'ubuntu-24.04'
            python-version: '3.7.13'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [[ "${{ matrix.python-version }}" != "3.7.13" ]]; then pip install -U mypy==1.8.0 black==24.1.1; fi
          pip install -U pylint clang-format ipython setuptools
          pip install numpy
          sudo apt-get update && sudo apt-get -y install libgsl-dev

      - name: Checkout trusted commit code
        uses: actions/checkout@v4
        with:
          ref: '49998cdc07570fc76c81d2f1bbc8670893075f04'
          path: trusted_code

      - name: Build trusted sebob executable
        run: |
          cd trusted_code &&
          pip install . &&
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_bob && (cd project/seobnrv5_bob && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrpy && (cd project/seobnrv5_nrpy && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrnqc_bob && (cd project/seobnrv5_nrnqc_bob && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_bob -calibration_no_spin && (cd project/seobnrv5_bob_calibration_no_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrpy -calibration_no_spin && (cd project/seobnrv5_nrpy_calibration_no_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrnqc_bob -calibration_no_spin && (cd project/seobnrv5_nrnqc_bob_calibration_no_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_bob -calibration_spin && (cd project/seobnrv5_bob_calibration_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrpy -calibration_spin && (cd project/seobnrv5_nrpy_calibration_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrnqc_bob -calibration_spin && (cd project/seobnrv5_nrnqc_bob_calibration_spin && make)
          cd ..

      - name: Build current sebob executable
        run: |
          pwd &&
          pip install . &&
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_bob && (cd project/seobnrv5_bob && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrpy && (cd project/seobnrv5_nrpy && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrnqc_bob && (cd project/seobnrv5_nrnqc_bob && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_bob -calibration_no_spin && (cd project/seobnrv5_bob_calibration_no_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrpy -calibration_no_spin && (cd project/seobnrv5_nrpy_calibration_no_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrnqc_bob -calibration_no_spin && (cd project/seobnrv5_nrnqc_bob_calibration_no_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_bob -calibration_spin && (cd project/seobnrv5_bob_calibration_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrpy -calibration_spin && (cd project/seobnrv5_nrpy_calibration_spin && make)
          python -m nrpy.examples.seobnrv5_aligned_spin_inspiral -seobnrv5_nrnqc_bob -calibration_spin && (cd project/seobnrv5_nrnqc_bob_calibration_spin && make)

      - name: Run on-the-fly comparison
        run: |
          python nrpy/examples/tests/sebob_consistency_check.py --trusted-exec ./trusted_code/project/seobnrv5_bob --current-exec ./project/seobnrv5_bob
          python nrpy/examples/tests/sebob_consistency_check.py --trusted-exec ./trusted_code/project/seobnrv5_bob_calibration_no_spin --current-exec ./project/seobnrv5_bob_calibration_no_spin
          python nrpy/examples/tests/sebob_consistency_check.py --trusted-exec ./trusted_code/project/seobnrv5_bob_calibration_spin --current-exec ./project/seobnrv5_bob_calibration_spin
          python nrpy/examples/tests/sebob_consistency_check.py --trusted-exec ./trusted_code/project/seobnrv5_nrpy --current-exec ./project/seobnrv5_nrpy
          python nrpy/examples/tests/sebob_consistency_check.py --trusted-exec ./trusted_code/project/seobnrv5_nrpy_calibration_no_spin --current-exec ./project/seobnrv5_nrpy_calibration_no_spin
          python nrpy/examples/tests/sebob_consistency_check.py --trusted-exec ./trusted_code/project/seobnrv5_nrpy_calibration_spin --current-exec ./project/seobnrv5_nrpy_calibration_spin
          python nrpy/examples/tests/sebob_consistency_check.py --trusted-exec ./trusted_code/project/seobnrv5_nrnqc_bob --current-exec ./project/seobnrv5_nrnqc_bob
          python nrpy/examples/tests/sebob_consistency_check.py --trusted-exec ./trusted_code/project/seobnrv5_nrnqc_bob_calibration_no_spin --current-exec ./project/seobnrv5_nrnqc_bob_calibration_no_spin
          python nrpy/examples/tests/sebob_consistency_check.py --trusted-exec ./trusted_code/project/seobnrv5_nrnqc_bob_calibration_spin --current-exec ./project/seobnrv5_nrnqc_bob_calibration_spin

      - name: Clean up
        run: |
          (cd trusted_code/project/seobnrv5_bob && make clean) &&
          (cd trusted_code/project/seobnrv5_bob_calibration_no_spin && make clean) &&
          (cd trusted_code/project/seobnrv5_bob_calibration_spin && make clean) &&
          (cd trusted_code/project/seobnrv5_nrpy && make clean) &&
          (cd trusted_code/project/seobnrv5_nrpy_calibration_no_spin && make clean) &&
          (cd trusted_code/project/seobnrv5_nrpy_calibration_spin && make clean) &&
          (cd trusted_code/project/seobnrv5_nrnqc_bob && make clean) &&
          (cd trusted_code/project/seobnrv5_nrnqc_bob_calibration_no_spin && make clean) &&
          (cd trusted_code/project/seobnrv5_nrnqc_bob_calibration_spin && make clean) &&
          (cd project/seobnrv5_bob && make clean) &&
          (cd project/seobnrv5_bob_calibration_no_spin && make clean) &&
          (cd project/seobnrv5_bob_calibration_spin && make clean) &&
          (cd project/seobnrv5_nrpy && make clean) &&
          (cd project/seobnrv5_nrpy_calibration_no_spin && make clean) &&
          (cd project/seobnrv5_nrpy_calibration_spin && make clean) &&
          (cd project/seobnrv5_nrnqc_bob && make clean) &&
          (cd project/seobnrv5_nrnqc_bob_calibration_no_spin && make clean) &&
