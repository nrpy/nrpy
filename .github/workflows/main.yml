  codegen-mac:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ 'macos-14', 'macos-26' ]
        # Dropped 3.6/3.7 because macos-14 is Apple Silicon (ARM64).
        # Python < 3.8 has poor/no support for ARM64 and causes architecture mismatches
        # with Homebrew libraries (like GSL) which are installed as ARM64.
        python-version: [ '3.9', '3.10', '3.11', '3.x' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [[ "${{ matrix.python-version }}" != "3.6.15" && "${{ matrix.python-version }}" != "3.7.13" ]]; then pip install -U mypy==1.8.0 black==24.1.1; fi
          pip install -U pylint clang-format ipython setuptools
          brew install gsl

      - name: Check that pip installed nrpy creates valid, compilable C example projects
        run: |
          pwd &&
          pip install . &&
          mkdir tmp &&
