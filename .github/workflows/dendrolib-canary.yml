name: Dendro validation against Dendrolib master

# Weekly check of the generated NRPy Dendro applications against the head of
# Dendrolib's master branch. Pull requests and pushes keep building against the
# commit pinned by the generator (main.yml, dendro-validation). A failure here
# appears in the Actions tab and marks an upstream change that would break
# them or change their stored-reference values; the log prints the Dendrolib
# commit that was built.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dendro-validation-dendrolib-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        formulation: [bssn, fccz4]
    env:
      OMP_NUM_THREADS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install MPI, GSL, BLAS/LAPACK, and Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openmpi-bin libopenmpi-dev libgsl-dev libopenblas-dev liblapack-dev gfortran

      - name: Install NRPy requirements
        run: python -m pip install -r requirements.txt

      - name: Generate, build, run, and check the ${{ matrix.formulation }} applications against Dendrolib master
        run: |
          python -u nrpy/examples/tests/dendro_application_check.py \
            --formulation "${{ matrix.formulation }}" \
            --work-dir "$RUNNER_TEMP/dendro-${{ matrix.formulation }}" \
            --dendrolib-ref master
