name: Projected RK3 CPU integration

on:
  pull_request:
    paths:
      - 'nrpy/equations/general_relativity/**'
      - 'nrpy/infrastructures/BHaH/MoLtimestepping/**'
      - 'nrpy/infrastructures/BHaH/general_relativity/**'
      - 'nrpy/infrastructures/BHaH/CurviBoundaryConditions/**'
      - 'nrpy/infrastructures/BHaH/simple_loop.py'
      - 'nrpy/infrastructures/BHaH/BHaH_defines_h.py'
      - 'nrpy/infrastructures/BHaH/CodeParameters.py'
      - 'nrpy/infrastructures/BHaH/griddata_commondata.py'
      - 'nrpy/c_codegen.py'
      - 'nrpy/c_function.py'
      - 'nrpy/finite_difference.py'
      - 'nrpy/grid.py'
      - 'nrpy/params.py'
      - 'nrpy/reference_metric.py'
      - 'nrpy/helpers/**'
      - '.github/tests/rk3_cpu/**'
      - '.github/workflows/rk3-projected-cpu.yml'
  push:
    branches: [main]
    paths:
      - 'nrpy/equations/general_relativity/**'
      - 'nrpy/infrastructures/BHaH/**'
      - 'nrpy/*.py'
      - 'nrpy/helpers/**'
      - '.github/tests/rk3_cpu/**'
      - '.github/workflows/rk3-projected-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense-tableau-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '4'
      OMP_THREAD_LIMIT: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install generation dependencies
        run: |
          python -m pip install appdirs==1.4.4 clang-format==23.1.0 nrpypn==2.0.1 sympy==1.14.0 mpmath==1.3.0 typing-extensions==4.16.0
          # GCC and the runner OS receive distribution security updates.
          # The check prints the resolved compiler and Python versions; numerical
          # evidence covers that toolchain, rather than every possible CPU/compiler.
          python -m pip freeze
      - name: Compare generated scalar and AVX2 timesteps with dense RK3
        run: python .github/tests/rk3_cpu/check.py
